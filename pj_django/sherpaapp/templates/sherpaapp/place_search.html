<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRIPA - 장소 검색</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'sherpaapp/css/style.css' %}">

</head>


<body>


<div class="detail-container">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


        <div class="logo">
            🏔️ TRIPA
        </div>


        <div class="menu-title">
            MENU
        </div>


        <ul class="menu">


            <li>
                <a href="{% url 'travel_list' %}">
                    ✈️ 내 여행
                </a>
            </li>


            <li>
                <a href="{% url 'travel_create' %}">
                    ➕ 여행 만들기
                </a>
            </li>


            <li>
                <a href="{% url 'place_search' %}"
                   class="active">
                    📍 장소 검색
                </a>
            </li>


            <li>
                <a href="{% url 'travel_detail' travel_id=1 %}">
                    📅 일정 관리
                </a>
            </li>


            <li>
                <a href="{% url 'budget' %}">
                    💰 비용 관리
                </a>
            </li>


        </ul>


        <div class="sidebar-user">
            👤 LEE
        </div>


    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="detail-content">


        <div class="page-title">

            <h1>
                📍 장소 검색
            </h1>

            <p>
                여행하고 싶은 장소를 검색하세요.
            </p>

        </div>


        <!-- 검색 -->

        <div class="search-box">


            <input
                type="text"
                placeholder="장소명을 입력하세요.">


            <button class="btn btn-primary">
                검색
            </button>


        </div>


        <!-- 장소 + 지도 -->

        <div class="place-layout">


            <!-- 검색 결과 -->

            <section class="place-results">


                <h2>
                    검색 결과
                </h2>


                <!-- 경복궁 -->

                <div class="place-result-card">


                    <div class="place-photo">
                        🏯
                    </div>


                    <div class="place-result-info">


                        <h3>
                            경복궁
                        </h3>


                        <p>
                            서울특별시 종로구
                        </p>


                        <span>
                            관광지
                        </span>


                        <br>


                        <button class="btn btn-primary">
                            일정에 추가
                        </button>


                    </div>


                </div>


                <!-- 북촌 -->

                <div class="place-result-card">


                    <div class="place-photo">
                        🏘️
                    </div>


                    <div class="place-result-info">


                        <h3>
                            북촌한옥마을
                        </h3>


                        <p>
                            서울특별시 종로구
                        </p>


                        <span>
                            관광지
                        </span>


                        <br>


                        <button class="btn btn-primary">
                            일정에 추가
                        </button>


                    </div>


                </div>


            </section>


            <!-- 지도 -->

            <section class="map-area">


                <div class="map-title">
                    🗺️ 지도
                </div>


                <div class="fake-map">


                    지도 API 영역


                    <div class="map-marker marker1">
                        📍
                    </div>


                    <div class="map-marker marker2">
                        📍
                    </div>


                </div>


            </section>


        </div>


    </main>


</div>


</body>
</html>
