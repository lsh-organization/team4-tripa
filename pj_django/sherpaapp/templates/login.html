<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHERPA - 로그인</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>

    <div class="logo">

        🏔️ SHERPA

    </div>


    <nav>

        <a href="travel_list.html">
            내 여행
        </a>

        <a href="travel_create.html">
            여행 만들기
        </a>

    </nav>

</header>



<div class="login-container">


    <div class="login-box">


        <h1>

            로그인

        </h1>


        <p class="login-text">

            SHERPA와 함께 여행을 계획하세요.

        </p>


        <form>


            <div class="form-group">

                <label>

                    아이디

                </label>


                <input
                    type="text"
                    placeholder="아이디 입력">

            </div>



            <div class="form-group">

                <label>

                    비밀번호

                </label>


                <input
                    type="password"
                    placeholder="비밀번호 입력">

            </div>



            <button
                type="button"
                class="btn btn-primary login-btn">

                로그인

            </button>


        </form>



        <div class="login-footer">

            아직 회원이 아니신가요?

            <a href="join.html">

                회원가입

            </a>

        </div>


    </div>


</div>


<style>


.login-container {

    min-height: calc(100vh - 70px);

    display: flex;

    align-items: center;

    justify-content: center;

}


.login-box {

    width: 400px;

    background-color: white;

    padding: 40px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.login-box h1 {

    text-align: center;

    margin-bottom: 10px;

}


.login-text {

    text-align: center;

    color: #777;

    margin-bottom: 30px;

}


.login-btn {

    width: 100%;

}


.login-footer {

    margin-top: 25px;

    text-align: center;

    font-size: 14px;

    color: #777;

}


.login-footer a {

    color: #2d6cdf;

    font-weight: bold;

}


</style>


</body>

</html>
