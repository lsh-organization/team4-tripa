<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>내 정보 - TRIPA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            min-height: 100vh;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .info {
            margin-bottom: 20px;
        }

        .info-title {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .info-value {
            background-color: #f5f7fa;
            padding: 14px;
            border-radius: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 30px;
            background-color: #3182ce;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👤 내 정보</h1>


    <div class="info">

        <div class="info-title">
            아이디(Email)
        </div>

        <div class="info-value">
            {{ member.email }}
        </div>

    </div>


    <div class="info">

        <div class="info-title">
            이름
        </div>

        <div class="info-value">
            {{ member.name }}
        </div>

    </div>


    <div class="info">

        <div class="info-title">
            닉네임
        </div>

        <div class="info-value">
            {{ member.nickname }}
        </div>

    </div>


    <a href="{% url 'index' %}" class="btn">
        홈으로
    </a>

    <a href="{% url 'logout' %}" class="btn">
        로그아웃
    </a>

</div>

</body>
</html>
