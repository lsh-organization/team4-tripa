<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SHERPA - 여행 만들기</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>


    <div class="logo">

        🏔️ SHERPA

    </div>



    <nav>

        <a href="travel_list.html">

            내 여행

        </a>


        <a href="travel_create.html">

            여행 만들기

        </a>


    </nav>


</header>



<div class="page-container">


    <div class="page-title">


        <h1>

            ✈️ 새로운 여행 만들기

        </h1>


        <p>

            여행 기본 정보를 입력해주세요.

        </p>


    </div>



    <div class="create-layout">


        <div class="card">


            <form>


                <div class="form-group">


                    <label>

                        여행 제목

                    </label>


                    <input
                        type="text"
                        placeholder="예) 서울 3박 4일 여행">


                </div>



                <div class="form-group">


                    <label>

                        여행 지역

                    </label>


                    <input
                        type="text"
                        placeholder="예) 서울">


                </div>



                <div class="date-group">


                    <div class="form-group">


                        <label>

                            여행 시작일

                        </label>


                        <input
                            type="date">


                    </div>



                    <div class="form-group">


                        <label>

                            여행 종료일

                        </label>


                        <input
                            type="date">


                    </div>


                </div>



                <div class="button-group">


                    <a
                        href="travel_list.html"
                        class="btn btn-secondary">

                        취소

                    </a>



                    <a
                        href="travel_detail.html"
                        class="btn btn-primary">

                        여행 만들기

                    </a>


                </div>


            </form>


        </div>



        <!-- 오른쪽 안내 -->


        <div class="card guide-card">


            <h2>

                💡 여행 만들기

            </h2>


            <p>

                1. 여행 제목을 입력합니다.

            </p>


            <p>

                2. 여행 지역을 입력합니다.

            </p>


            <p>

                3. 여행 기간을 선택합니다.

            </p>


            <p>

                4. 여행을 생성한 후 장소를 추가합니다.

            </p>


        </div>


    </div>


</div>



<style>


.create-layout {

    display: grid;

    grid-template-columns: 2fr 1fr;

    gap: 25px;

}


.date-group {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

}


.button-group {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

}


.guide-card h2 {

    margin-bottom: 25px;

}


.guide-card p {

    padding: 12px 0;

    border-bottom: 1px solid #eee;

}


@media screen and (max-width: 768px) {


    .create-layout {

        grid-template-columns: 1fr;

    }


    .date-group {

        grid-template-columns: 1fr;

    }


}


</style>


</body>

</html>
