<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SHERPA - 장소 검색</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>


    <div class="logo">

        🏔️ SHERPA

    </div>



    <nav>

        <a href="travel_list.html">

            내 여행

        </a>


        <a href="travel_create.html">

            여행 만들기

        </a>


        <a href="place_search.html">

            장소 검색

        </a>


    </nav>



    <div>

        👤 LEE

    </div>


</header>



<div class="page-container">


    <div class="page-title">


        <h1>

            📍 장소 검색

        </h1>


        <p>

            여행하고 싶은 장소를 검색하세요.

        </p>


    </div>



    <!-- 검색 -->


    <div class="search-box">


        <input
            type="text"
            placeholder="장소명을 입력하세요.">


        <button class="btn btn-primary">

            검색

        </button>


    </div>



    <!-- 장소 + 지도 -->


    <div class="place-layout">


        <!-- 장소 목록 -->


        <section class="place-results">


            <h2>

                검색 결과

            </h2>



            <div class="place-result-card">


                <div class="place-photo">

                    🏯

                </div>



                <div class="place-result-info">


                    <h3>

                        경복궁

                    </h3>


                    <p>

                        서울특별시 종로구

                    </p>


                    <span>

                        관광지

                    </span>


                    <br><br>


                    <button class="btn btn-primary">

                        일정에 추가

                    </button>


                </div>


            </div>



            <div class="place-result-card">


                <div class="place-photo">

                    🏘️

                </div>



                <div class="place-result-info">


                    <h3>

                        북촌한옥마을

                    </h3>


                    <p>

                        서울특별시 종로구

                    </p>


                    <span>

                        관광지

                    </span>


                    <br><br>


                    <button class="btn btn-primary">

                        일정에 추가

                    </button>


                </div>


            </div>


        </section>



        <!-- 지도 -->


        <section class="map-area">


            <div class="map-title">

                🗺️ 지도

            </div>


            <div class="fake-map">

                지도 API 영역


                <div class="map-marker marker1">

                    📍

                </div>


                <div class="map-marker marker2">

                    📍

                </div>


            </div>


        </section>


    </div>


</div>



<style>


.search-box {

    display: flex;

    gap: 10px;

    margin-bottom: 30px;

}


.search-box input {

    flex: 1;

    padding: 15px;

    border:

        1px solid #ddd;

    border-radius: 8px;

}


.place-layout {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;

}


.place-results {

    background-color: white;

    padding: 25px;

    border-radius: 15px;

}


.place-results h2 {

    margin-bottom: 20px;

}


.place-result-card {

    display: flex;

    padding: 15px 0;

    border-bottom: 1px solid #eee;

}


.place-photo {

    width: 100px;

    height: 100px;

    background-color: #e7eefc;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 40px;

    margin-right: 15px;

}


.place-result-info {

    flex: 1;

}


.place-result-info h3 {

    margin-bottom: 10px;

}


.place-result-info p {

    color: #777;

    margin-bottom: 10px;

}


.place-result-info span {

    background-color: #eef3ff;

    color: #2d6cdf;

    padding: 5px 10px;

    border-radius: 15px;

    font-size: 12px;

}


.map-area {

    background-color: white;

    padding: 25px;

    border-radius: 15px;

}


.map-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 20px;

}


.fake-map {

    height: 500px;

    background:
        linear-gradient(
            135deg,
            #e4f1e7,
            #dceafa
        );

    border-radius: 10px;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #777;

}


.map-marker {

    position: absolute;

    font-size: 30px;

}


.marker1 {

    top: 100px;

    left: 30%;

}


.marker2 {

    top: 250px;

    left: 60%;

}


@media screen and (max-width: 768px) {


    .place-layout {

        grid-template-columns: 1fr;

    }


}


</style>


</body>

</html>
