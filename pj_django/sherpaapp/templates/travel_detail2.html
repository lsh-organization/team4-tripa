<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SHERPA - 여행 일정</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>


    <div class="logo">

        🏔️ SHERPA

    </div>



    <nav>

        <a href="travel_list.html">

            내 여행

        </a>


        <a href="travel_create.html">

            여행 만들기

        </a>


        <a href="place_search.html">

            장소 검색

        </a>


    </nav>



    <div>

        👤 LEE

    </div>


</header>



<div class="page-container">


    <!-- 여행 정보 -->


    <section class="travel-header card">


        <div>


            <h1>

                🗺️ 서울 여행

            </h1>


            <p>

                📅 2026.09.09 ~ 2026.09.12

            </p>


        </div>



        <button class="btn btn-primary">

            여행 수정

        </button>


    </section>



    <!-- DAY 선택 -->


    <section class="day-selector">


        <button class="day active">

            DAY 1

            <small>

                09.09

            </small>

        </button>



        <button class="day">

            DAY 2

            <small>

                09.10

            </small>

        </button>



        <button class="day">

            DAY 3

            <small>

                09.11

            </small>

        </button>


    </section>



    <!-- 지도 -->


    <section class="card map-section">


        <h2>

            🗺️ 여행 지도

        </h2>


        <div class="detail-map">


            지도 API 영역


            <div class="number-marker m1">

                1

            </div>


            <div class="number-marker m2">

                2

            </div>


            <div class="number-marker m3">

                3

            </div>


        </div>


    </section>



    <!-- 일정 -->


    <section class="card timeline-section">


        <h2>

            📅 DAY 1 일정

        </h2>



        <div class="timeline-item">


            <div class="time">

                10:00

            </div>


            <div class="place">

                <h3>

                    ① 경복궁

                </h3>


                <p>

                    📍 서울특별시 종로구

                </p>


                <p>

                    ⏱ 체류 시간 : 2시간

                </p>


            </div>


        </div>



        <div class="timeline-item">


            <div class="time">

                13:00

            </div>


            <div class="place">

                <h3>

                    ② 북촌한옥마을

                </h3>


                <p>

                    📍 서울특별시 종로구

                </p>


                <p>

                    ⏱ 체류 시간 : 1시간 30분

                </p>


            </div>


        </div>



        <div class="timeline-item">


            <div class="time">

                16:00

            </div>


            <div class="place">

                <h3>

                    ③ 남산타워

                </h3>


                <p>

                    📍 서울특별시 용산구

                </p>


                <p>

                    ⏱ 체류 시간 : 2시간

                </p>


            </div>


        </div>


    </section>



    <!-- 비용 -->


    <section class="card pay-section">


        <h2>

            💰 여행 비용

        </h2>



        <div class="pay-item">

            <span>

                식사

            </span>


            <strong>

                15,000원

            </strong>

        </div>



        <div class="pay-item">

            <span>

                입장료

            </span>


            <strong>

                3,000원

            </strong>

        </div>



        <div class="pay-item total">

            <span>

                총 비용

            </span>


            <strong>

                18,000원

            </strong>

        </div>


    </section>


</div>



<style>


.travel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

}


.travel-header h1 {

    margin-bottom: 10px;

}


.travel-header p {

    color: #777;

}


/* DAY */


.day-selector {

    display: flex;

    gap: 10px;

    margin-bottom: 25px;

}


.day {

    border: none;

    padding: 15px 25px;

    border-radius: 10px;

    background-color: white;

    cursor: pointer;

}


.day small {

    display: block;

    margin-top: 5px;

}


.day.active {

    background-color: #2d6cdf;

    color: white;

}


/* 지도 */


.map-section {

    margin-bottom: 25px;

}


.map-section h2 {

    margin-bottom: 20px;

}


.detail-map {

    height: 400px;

    background:
        linear-gradient(
            135deg,
            #e4f1e7,
            #dceafa
        );

    border-radius: 10px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777;

}


.number-marker {

    position: absolute;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    background-color: #2d6cdf;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

}


.m1 {

    top: 100px;

    left: 25%;

}


.m2 {

    top: 200px;

    left: 50%;

}


.m3 {

    top: 280px;

    left: 70%;

}


/* 타임라인 */


.timeline-section {

    margin-bottom: 25px;

}


.timeline-section h2 {

    margin-bottom: 25px;

}


.timeline-item {

    display: flex;

    margin-bottom: 20px;

}


.time {

    width: 100px;

    color: #2d6cdf;

    font-weight: bold;

}


.place {

    flex: 1;

    background-color: #f7f8fc;

    padding: 18px;

    border-radius: 10px;

}


.place h3 {

    margin-bottom: 10px;

}


.place p {

    color: #777;

    font-size: 14px;

    margin-top: 5px;

}


/* 비용 */


.pay-section h2 {

    margin-bottom: 20px;

}


.pay-item {

    display: flex;

    justify-content: space-between;

    padding: 15px 0;

    border-bottom: 1px solid #eee;

}


.total {

    font-size: 18px;

    color: #2d6cdf;

}


</style>


</body>

</html>
