<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SHERPA - 회원가입</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>

    <div class="logo">

        🏔️ SHERPA

    </div>


</header>



<div class="join-container">


    <div class="join-box">


        <h1>

            회원가입

        </h1>


        <p>

            SHERPA 회원이 되어 여행을 계획하세요.

        </p>



        <form>


            <div class="form-group">

                <label>

                    아이디

                </label>


                <input
                    type="text"
                    placeholder="아이디 입력">

            </div>



            <div class="form-group">

                <label>

                    비밀번호

                </label>


                <input
                    type="password"
                    placeholder="비밀번호 입력">

            </div>



            <div class="form-group">

                <label>

                    비밀번호 확인

                </label>


                <input
                    type="password"
                    placeholder="비밀번호 다시 입력">

            </div>



            <div class="form-group">

                <label>

                    이름

                </label>


                <input
                    type="text"
                    placeholder="이름 입력">

            </div>



            <div class="form-group">

                <label>

                    닉네임

                </label>


                <input
                    type="text"
                    placeholder="닉네임 입력">

            </div>



            <button
                type="button"
                class="btn btn-primary join-btn">

                회원가입

            </button>


        </form>



        <div class="join-footer">

            이미 회원이신가요?

            <a href="login.html">

                로그인

            </a>

        </div>


    </div>


</div>



<style>


.join-container {

    display: flex;

    justify-content: center;

    padding: 50px 20px;

}


.join-box {

    width: 450px;

    background-color: white;

    padding: 40px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.join-box h1 {

    text-align: center;

    margin-bottom: 10px;

}


.join-box > p {

    text-align: center;

    color: #777;

    margin-bottom: 30px;

}


.join-btn {

    width: 100%;

}


.join-footer {

    margin-top: 25px;

    text-align: center;

    color: #777;

}


.join-footer a {

    color: #2d6cdf;

    font-weight: bold;

}


</style>


</body>

</html>
