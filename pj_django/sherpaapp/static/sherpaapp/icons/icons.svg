<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    TRIPA 아이콘 모음
    - 한 기능에는 한 아이콘만 쓴다. (화면마다 새로 그리지 않고 이름으로 불러 쓴다)
    - 24x24 격자, 선 두께 1.8, 둥근 끝. 색은 글자색(currentColor)을 따라간다.
    사용: <svg class="tp-icon"><use href=".../icons.svg#i-pin"></use></svg>
  -->

  <!-- 로고 : 산과 해 -->
  <symbol id="i-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 19.5 9.2 8.5l3.6 6.2 2.3-3.7L21 19.5z"/>
    <circle cx="17.6" cy="6.4" r="1.7"/>
  </symbol>

  <!-- 회원 -->
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>
  </symbol>

  <!-- 여행 시작 : 종이비행기 -->
  <symbol id="i-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 3.5 3.5 10.2l6.8 3.1 3.2 6.9z"/>
    <path d="m10.3 13.3 6.4-6.4"/>
  </symbol>

  <!-- 내 여행 : 여행 가방 -->
  <symbol id="i-suitcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="7.5" width="17" height="12.5" rx="3"/>
    <path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/>
    <path d="M8.5 7.5V20M15.5 7.5V20"/>
  </symbol>

  <!-- 지도 · 여행 계획 -->
  <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5.2 3.5 7.2v11.6L9 16.8l6 2 5.5-2V5.2L15 7.2z"/>
    <path d="M9 5.2v11.6M15 7.2v11.6"/>
  </symbol>

  <!-- 날짜 · 일정 -->
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
