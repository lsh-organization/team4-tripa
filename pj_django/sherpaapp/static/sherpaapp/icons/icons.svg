  <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 21V4M5.5 4.5h11l-2 3.7 2 3.7h-11"/>
  </symbol>

